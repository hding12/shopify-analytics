name: Validate growth control
on:
  push:
    paths:
      - 'control/**'
      - 'records/**'
      - 'docs/**'
      - 'state/**'
      - 'scripts/validate_growth_day.py'
      - 'tests/test_growth_day_audit.py'
      - 'scripts/growth_control.py'
      - 'scripts/validate_incremental_records.py'
      - 'tests/test_t26_incremental.py'
      - '.github/workflows/growth-control-check.yml'
  pull_request:
    paths:
      - 'control/**'
      - 'records/**'
      - 'docs/**'
      - 'state/**'
      - 'scripts/validate_growth_day.py'
      - 'tests/test_growth_day_audit.py'
      - 'scripts/growth_control.py'
      - 'scripts/validate_incremental_records.py'
      - 'tests/test_t26_incremental.py'
      - '.github/workflows/growth-control-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/growth_control.py validate
      - run: python3 scripts/growth_control.py status
      - run: python3 scripts/validate_growth_day.py
      - run: python3 scripts/validate_incremental_records.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
